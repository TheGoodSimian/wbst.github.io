<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Photographs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            margin: 20px 0;
        }
        
        h1 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .blog-subtitle {
            font-size: 1.1rem;
            color: #7f8c8d;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(20rem, 50rem));
            gap: 20px;
        }
        
        .painting-card {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: all 0.3s;
            height:fit-content;
            aspect-ratio:unset;
            
        }
        
        .painting-card img {
            width: 100%;
            height: 100%;
            object-fit:scale-down;
            transition: transform 0.3s;
        }
        
        
        .painting-card h3 {
            color: #2c3e50;
            font-size: 1.1rem;
            margin-top: 10px;
            padding: 0 10px;
            text-align: center;
            background: rgba(255,255,255,0.95);
            position: absolute;
            bottom: 0;
            width: 100%;
        }
        
        .gallery-footer {
            text-align: center;
            margin-top: 30px;
            color: #7f8c8d;
            font-size: 0.95rem;
        }
        
        .back-to-blog {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            margin-top: 15px;
            display: inline-block;
            transition: color 0.3s;
        }
        
        .back-to-blog:hover {
            color: #2980b9;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Photographs</h1>
    </header>

    <div class="gallery">
        <div class="painting-card">
            <img src="./res/GOE.jpg" alt="The Fruit">
        </div>

         <div class="painting-card">
            <img src="./res/valley.jpg" alt="Valley">
        </div>

        <div class="painting-card">
            <img src="./res/sun.jpg" alt="Eidolon">
        </div>
             
        <div class="painting-card">
            <img src="./res/trick-of-perception.jpg" alt="Appearances">
        </div>

        <div class="painting-card">
            <img src="./res/descent.jpg" alt="Descent">
        </div>

         <div class="painting-card">
            <img src="./res/horse.jpg" alt="Horse">
        </div>

        <div class="painting-card">
            <img src="./res/img_20180929_171038.jpg" alt="A Meeting of the Seasons">
        </div>

        </div>
        
    </div>

    <div class="gallery-footer">
        <p><a href="index.html" class="back-to-blog">Back to Home</a></p>
    </div>
</body>
</html>
