<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Paintings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    color: #333;
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

header {
    text-align: center;
    padding: 20px 0;
    margin: 20px 0;
}

h1 {
    font-size: 2rem;
    color: #2c3e50;
    margin-bottom: 10px;
}

.blog-subtitle {
    font-size: 1.1rem;
    color: #7f8c8d;
    max-width: 800px;
    margin: 0 auto;
}

/* ================= GALLERY ================= */

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 2fr));
    gap: 20px;
}

/* Card is now size-stable */
.painting-card-tall {
    position: relative;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.painting-card-wide {
    position: relative;
    aspect-ratio: 5 / 4;
    overflow: hidden;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}


/* Image locked to container */
.painting-card-tall img {
    width: 90%;
    height: 90%;
    object-fit: cover;
    transition: transform 0.3s ease;
}


/* Subtitle anchored inside card */
.painting-card-wide h3 {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 10px;
    font-size: 1.1rem;
    text-align: center;
    color: #2c3e50;
    background: rgba(255,255,255,0.95);
}

.painting-card-wide img {
    width: 70%;
    height: 70%;
    object-fit: cover;
    transition: transform 0.3s ease;
}


/* Subtitle anchored inside card */
.painting-card-tall h3 {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 10px;
    font-size: 1.1rem;
    text-align: center;
    color: #2c3e50;
    background: rgba(255,255,255,0.95);
}

/* ================= FOOTER ================= */

.gallery-footer {
    text-align: center;
    margin-top: 30px;
    color: #7f8c8d;
    font-size: 0.95rem;
}

.back-to-blog {
    color: #3498db;
    text-decoration: none;
    font-weight: 600;
    margin-top: 15px;
    display: inline-block;
    transition: color 0.3s ease;
}

.back-to-blog:hover {
    color: #2980b9;
}

    </style>

</head>
<body>
    <header>
        <h1>My Paintings</h1>
        <p class="blog-subtitle"></p>
    </header>

    <div class="gallery">
        <div class="painting-card-tall">
            <img src="./res/vibrant-mountainscape.jpg" alt="Vibrant Mountain Landscape">
            <h3>Vibrant Mountains</h3>
        </div>
             
        <div class="painting-card-tall">
            <img src="./res/night-mountain.jpeg" alt="Dark Mountain">
            <h3>Dark Mountain</h3>
        </div>

        <div class="painting-card-tall">
            <img src="./res/607508660_17895596160369956_3709628078915898072_n.jpg" alt="Writing in Fire">
            <h3>Writing in Fire</h3>
        </div>
        
        <div class="painting-card-wide">
            <img src="./res/607653268_17895596076369956_8853265599939620810_n.jpg" alt="Blue Tapestry">
            <!-- <h3>Blue Tapestry</h3> -->
        </div>
        
    </div>

    <div class="gallery-footer">
        <p><a href="index.html" class="back-to-blog">Back to Home</a></p>
    </div>
</body>
</html>
